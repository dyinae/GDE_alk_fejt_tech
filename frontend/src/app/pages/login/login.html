<div class="wrapper">
  <div class="card">

    <h2>Bejelentkezés</h2>

    <form (ngSubmit)="onLogin()">

      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Felhasználónév"
        required
      />

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Jelszó"
        required
      />

      <button type="submit">Login</button>

    </form>

    <div *ngIf="errorMessage" class="message error">
      {{ errorMessage }}
    </div>

  </div>
</div>
