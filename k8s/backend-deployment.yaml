apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking-root
  namespace: argocd       
spec:
  project: default
  source:
    repoURL: https://github.com/dyinae/GDE_alk_fejt_tech.git
    targetRevision: dev
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default     
  syncPolicy:
    automated:
      prune: true
      selfHeal: true